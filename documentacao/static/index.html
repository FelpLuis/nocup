<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPDOWN · Documentação de Equipamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="/monograma.svg" type="image/svg+xml">
<script src="/vendor/three.min.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<style id="css">
:root{
  --bg:#05051a;--bg2:#0a0a2b;--panel:rgba(20,0,117,.22);--panel-solid:#0d0b36;--line:rgba(11,187,239,.18);--line2:rgba(255,255,255,.08);
  --blue:#0B0FEE;--navy:#140075;--cyan:#0BBBEF;--purple:#9B00FF;--ink:#eef0ff;--ink2:#a9adda;--ink3:#6c70a3;
  --up:#2fd67b;--down:#ff4d5e;--shut:#7a80a6;--part:#ffb020;--nd:#454a6e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
 radial-gradient(1200px 600px at 85% -10%,rgba(155,0,255,.18),transparent 60%),
 radial-gradient(900px 500px at -10% 10%,rgba(11,15,238,.22),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',monospace}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:46px;width:auto;display:block}
.brand-sep{width:1px;height:38px;background:linear-gradient(var(--cyan),var(--purple));opacity:.6}
.brand h1{margin:0;font-size:19px;letter-spacing:.02em;font-weight:700}
.brand h1 b{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--ink2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:rgba(11,15,238,.12);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--cyan);background:rgba(11,187,239,.15);box-shadow:0 0 18px rgba(11,187,239,.25)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:transparent}
.btn.primary:hover{box-shadow:0 0 24px rgba(155,0,255,.5)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--down);background:rgba(255,77,94,.12);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.user{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.user a{color:var(--ink3);text-decoration:none;border:1px solid var(--line2);padding:5px 9px;border-radius:8px}
.user a:hover{color:#fff;border-color:var(--cyan)}
.ro-mode .edit-only{display:none!important}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;color:var(--ink2);font-size:14px;text-align:center}
#boot img{height:56px;display:block;margin:0 auto 18px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.save-state{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.dot.dirty{background:var(--part);box-shadow:0 0 8px var(--part)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:hidden;backdrop-filter:blur(8px)}
.kpi::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--c,var(--cyan)),transparent 70%);opacity:.18}
.kpi .lb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:32px;font-weight:700;margin-top:6px;line-height:1}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:4px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* grid */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);position:relative}
.card h2{white-space:nowrap;margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
#stage{position:relative;height:600px;overflow:hidden;border-radius:var(--r)}
#stage canvas{display:block;cursor:grab}
#stage canvas:active{cursor:grabbing}
.stage-hd{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;pointer-events:none}
.stage-hd>*{pointer-events:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.hint{position:absolute;bottom:12px;left:16px;font-size:11px;color:var(--ink3);z-index:2;pointer-events:none}
.ctrls{position:absolute;bottom:10px;right:12px;z-index:2;display:flex;gap:6px}
.ctrls .btn{padding:6px 10px;font-size:12px}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(8,6,40,.95);border:1px solid var(--cyan);border-radius:10px;padding:8px 11px;font-size:12px;max-width:320px;opacity:0;transition:opacity .12s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tip b{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:3px}
#tip .t{color:var(--ink2)}
/* detail */
.detail{padding:16px;display:flex;flex-direction:column;gap:14px;height:100%}
.dev-title{display:flex;align-items:flex-start;gap:12px}
.dev-title .ic{width:44px;height:44px;border-radius:12px;background:#1A1818;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.dev-title h3{margin:0;font-size:22px}
.dev-title p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.field input,.field textarea{width:100%;background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;transition:.15s}
.field input:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(11,187,239,.15)}
.field textarea{resize:vertical;min-height:52px}
.field.full{grid-column:1/-1}
.statbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:transparent}
.statbar div{height:100%;transition:flex .6s cubic-bezier(.2,.8,.2,1);min-width:0;cursor:default}
.statbar div:first-child{border-radius:7px 0 0 7px}.statbar div:last-child{border-radius:0 7px 7px 0}
.statleg{display:grid;grid-template-columns:repeat(5,auto);gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:8px;justify-content:start}
.statleg b{color:var(--ink);font-weight:600;margin-left:2px}
.svc{display:flex;flex-direction:column;gap:6px}
.svc .row{display:grid;grid-template-columns:120px 1fr 34px;align-items:center;gap:8px;font-size:12px}
.svc .row .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .row .b{height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.svc .row .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:0 4px 4px 0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.svc .row .c{text-align:right;font-family:'JetBrains Mono',monospace;color:var(--ink)}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
/* tabs + table */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.tab{padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(5,5,26,.4);cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;transition:.2s}
.tab:hover{border-color:var(--line)}
.tab.on{border-color:var(--cyan);background:rgba(11,187,239,.12);box-shadow:0 0 16px rgba(11,187,239,.2)}
.tab .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
.tab.empty .cnt{color:var(--ink3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.toolbar input[type=search],.toolbar select{background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;outline:none}
.toolbar input[type=search]{min-width:240px;flex:1;max-width:380px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--cyan)}
select option{background:#0d0b36}
.tbl-wrap{overflow:auto;max-height:620px;border-top:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#0b0930;z-index:1;text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--ink)}
tbody tr{border-bottom:1px solid var(--line2);transition:background .15s}
tbody tr:hover{background:rgba(11,187,239,.05)}
tbody tr.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(11,187,239,.28)}100%{background:transparent}}
td{padding:3px 6px;vertical-align:middle}
td input,td select{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 6px;font-size:13px;outline:none}
td input:hover{border-color:var(--line2)}
td input:focus,td select:focus{border-color:var(--cyan);background:rgba(5,5,26,.8)}
td.if input{font-family:'JetBrains Mono',monospace;font-size:12px}
td.st{width:132px}
td.st select{font-size:12px;font-weight:600;padding-left:22px;cursor:pointer;appearance:none;background-repeat:no-repeat;background-position:8px center;background-size:8px 8px}
td.tp{width:72px;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.act{width:70px;text-align:center}
.x{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:11px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--down);background:rgba(255,77,94,.1)}
.empty-msg{padding:40px;text-align:center;color:var(--ink2)}
.empty-msg p{margin:6px 0 16px;color:var(--ink3)}
.foot{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,2,14,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60}
.modal.on{display:grid}
.modal .box{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 6px}
.modal p{color:var(--ink2);font-size:14px;margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal .field{margin-bottom:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--panel-solid);border:1px solid var(--cyan);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.sites{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(5,5,26,.55);font-size:12px;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--line)}
.chip.on{border-color:var(--cyan);background:rgba(11,187,239,.14);color:#fff}
.tabgrp{display:flex;flex-direction:column;gap:6px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line2)}
.tabgrp:last-child{border-right:none}
.tabgrp .gl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.tabgrp .gl{color:var(--cyan)}
.tabgrp .row{display:flex;gap:6px;flex-wrap:wrap}
td.zb{width:150px;font-size:12px;white-space:nowrap;color:var(--ink2)}
td.zb .zd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
td.zb .warn{color:#1A1818;background:var(--part);font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:5px;cursor:help}
td.opt{width:118px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);white-space:nowrap}
td.opt .lo{color:var(--part)}
.lowb{font-size:10px;color:var(--part)}
.badge{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:rgba(155,0,255,.2);color:#d9a6ff;margin-left:6px;vertical-align:middle}
.ro{font-size:12px;color:var(--ink2);padding:7px 9px;background:rgba(5,5,26,.35);border:1px dashed var(--line2);border-radius:8px;min-height:32px;word-break:break-all}
.zbx-line{font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.zbx-line .dot{width:6px;height:6px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}#stage{height:440px}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.toolbar input[type=search]{min-width:0}}
</style>
</head>
<body>
<template id="shell">
<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo" src="/logo-updown.png" alt="UPDOWN Internet" width="180" height="54">
      <div class="brand-sep"></div>
      <div><h1>Documentação de equipamentos</h1><small>NOC · roteadores, switches e DWDM</small></div>
    </div>
    <div class="spacer"></div>
    <div class="save-state"><span class="dot" id="dot"></span><span id="saveTxt">Carregando…</span></div>
    <button class="btn ghost" id="bSync" title="Ler o Zabbix agora">Ler Zabbix</button>
    <button class="edit-only btn" id="bImport" title="Importar uma planilha no mesmo formato (uma aba por equipamento)">Importar XLSX</button>
    <input type="file" id="fImport" accept=".xlsx,.xls" class="hidden">
    <button class="btn" id="bXlsx">Exportar XLSX</button>
    <button class="btn" id="bCsv">Exportar CSV</button>
    <button class="edit-only btn primary" id="bSave">Salvar alterações</button>
    <div class="user" id="user"></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card">
      <div id="stage">
        <div class="stage-hd">
          <h2>Racks por site</h2>
          <div class="sites" id="sites"></div>
          <div class="spacer"></div>
          <div class="legend" id="legend3d"></div>
        </div>
        <div class="hint">Arraste para girar · botão direito move · role para zoom · clique num equipamento ou porta</div>
        <div class="ctrls">
          <button class="btn ghost" id="bSpin">Auto-giro</button>
          <button class="btn ghost" id="bLinks">Enlaces</button>
          <button class="btn ghost" id="bReset">Centralizar</button>
        </div>
      </div>
    </div>
    <div class="card"><div class="detail" id="detail"></div></div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Buscar interface, destino, serviço, observação…">
      <select id="fSt"><option value="">Todos os status</option></select>
      <select id="fSvc"><option value="">Todos os serviços</option></select>
      <select id="fTp"><option value="">Física e lógica</option><option value="F">Somente físicas</option><option value="L">Somente lógicas</option></select>
      <select id="fZ"><option value="">Zabbix: todas</option><option value="div">Divergem do Zabbix</option><option value="mon">Monitoradas no Zabbix</option><option value="nomon">Fora do Zabbix</option><option value="new">Importadas do Zabbix</option></select>
      <div class="spacer"></div>
      <button class="edit-only btn hidden" id="bZnew" title="Interfaces que existem no Zabbix e ainda não estão nesta documentação">Importar <span></span> do Zabbix</button>
      <button class="edit-only btn" id="bAddRow">Nova interface</button>
      <button class="edit-only btn" id="bAddDev">Novo equipamento</button>
      <button class="edit-only btn danger" id="bDelDev">Excluir equipamento</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-k="i">Interface</th><th data-k="tp">Tipo</th><th data-k="d">Destino</th><th data-k="s">Serviço</th><th data-k="o">Observação</th><th data-k="st">Status (doc.)</th><th data-k="zst">Zabbix</th><th data-k="rx">Rx / Tx dBm</th><th></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty-msg hidden" id="emptyMsg"><b>Nenhuma interface documentada</b><p>Esta aba estava vazia na planilha. Adicione as interfaces aqui ou importe a planilha atualizada.</p><button class="edit-only btn primary" id="bAddRow2">Adicionar interface</button></div>
    </div>
    <div class="foot"><span id="footL"></span><span id="footR"></span></div>
  </section>
</div>
<div id="tip"></div>
<div id="boot"><div><img src="/logo-updown.png" alt=""><span id="bootTxt">Carregando a documentação…</span></div></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
</template>
<script id="app">
(function(){
'use strict';
const SHELL = document.getElementById('shell');
document.body.appendChild(SHELL.content.cloneNode(true));

let S = {devices:[]}, REV = 1, CAN_EDIT = false, USER = null, ZC = {hosts:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STATUS = {
  'UP':{c:'#2fd67b',l:'Up'},
  'DOWN':{c:'#ff4d5e',l:'Down'},
  'PARCIAL':{c:'#ffb020',l:'Proto down'},
  'SHUTDOWN':{c:'#7a80a6',l:'Shutdown'},
  'N/D':{c:'#454a6e',l:'Sem status'}
};
const ST_KEYS = Object.keys(STATUS);
const isPhys = i => (/^(\d+GE|XGE|GE|MEth|10GE|40GE)\d/i.test(i) || /^(hundred|four-hundred)-g|^(gpon|xgei|gei)_\d/i.test(i)) && !/\.\d+/.test(i.replace(/\(.*\)/,''));
const physSpeed = i => { if(/^gpon_/i.test(i)) return 'GPON'; if(/^xgei_/i.test(i)) return '10G'; if(/^gei_/i.test(i)) return '1G'; const m=i.match(/^(\d+)GE/i); if(m) return m[1]+'G'; if(/^XGE/i.test(i)) return '10G'; if(/^MEth/i.test(i)) return 'MGMT'; const p=i.match(/\((\d+\w)\)/); return p?p[1]:'1G'; };

let cur = 0, dirty = false, sortK = null, sortDir = 1;
const isDiv = p => !!(p.z && p.z.st && p.st !== 'N/D' && ((p.st === 'UP') !== (p.z.st === 'UP')));
const rackKey = d => (d.site || 'Sem site') + '||' + (d.rack || '');
const rackName = d => d.rack || 'Sem localização no Zabbix';

/* ---------- servidor ---------- */
async function api(method, url, body){
  const r = await fetch(url, {method, headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined, credentials:'same-origin'});
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.hash); throw new Error('login'); }
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const e = new Error((j && (j.error || j.erro)) || ('HTTP ' + r.status)); e.status = r.status; e.data = j; throw e; }
  return j;
}
function markDirty(){ if(!CAN_EDIT) return; dirty = true; updSave(); }
function updSave(){
  $('#dot').classList.toggle('dirty', dirty);
  $('#saveTxt').textContent = !CAN_EDIT ? 'Somente consulta' : dirty ? 'Alterações não salvas' : 'Tudo salvo';
  $('#bSave').disabled = !dirty;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),3200); }
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function cleanDoc(){ const d = JSON.parse(JSON.stringify(S, (k,v)=> (k==='z'||k==='_znew'||k==='_zh') ? undefined : v)); return d; }
async function save(){
  if(!dirty || !CAN_EDIT) return;
  $('#saveTxt').textContent = 'Salvando…'; $('#bSave').disabled = true;
  try {
    const r = await api('PUT', '/api/dados', {rev: REV, doc: cleanDoc()});

  } catch (e) {

      modal(`<h3>Alguém salvou antes de você</h3><p>${esc(by)} salvou uma versão nova enquanto você editava. Recarregue para ver a versão atual (o que você não salvou se perde) ou baixe antes um XLSX com o que está na sua tela.</p><div class="acts"><button class="btn ghost" id="cfX">Baixar XLSX</button><button class="btn primary" id="cfR">Recarregar</button></div>`);

}

/* ---------- Zabbix (status ao vivo; não é gravado na documentação) ---------- */
const normIf = n => String(n||'').replace(/\(.*?\)/g,'').trim().replace('XGigabitEthernet','XGE').replace('GigabitEthernet','GE').toUpperCase();
function zIndex(d){
  const idx = {}; (d.zabbix_hosts||[]).forEach((hn, hi) => { const H = ZC.hosts && ZC.hosts[hn]; if (!H) return;
    (H.ifs||[]).forEach(f => { const k = normIf(f.i), e = idx[k];
      const z = {st:f.st||'', sp:f.sp||'', rx:f.rx||'', tx:f.tx||'', a:f.a||'', i:f.i}; if (hi>0) z.vs = 1;
      if (f.onus !== undefined) { z.onus = f.onus; z.rxm = f.rxm||''; z.low = f.low||''; z.worst = f.worst||''; }
      if (!e) idx[k] = z; else { for (const c of ['st','sp','rx','tx','a']) if (!e[c] && z[c]) e[c] = z[c]; } }); });
  return idx;
}
function zHost(d){ return (d.zabbix_hosts||[]).map(n => ZC.hosts && ZC.hosts[n]).filter(Boolean)[0] || null; }
function applyZ(){
  S.devices.forEach(d => { const idx = zIndex(d); d._znew = [];
    const have = new Set(d.ports.map(p => normIf(p.i)));
    d.ports.forEach(p => { const z = idx[normIf(p.i)]; if (z) p.z = z; else delete p.z; });
    Object.entries(idx).forEach(([k, z]) => { if (!have.has(k)) d._znew.push(z); });
    const H = zHost(d); d._zh = H ? {sysname:H.sysname, location:H.location, version:H.version, model:H.model, ip:H.ip, ping:H.ping} : null; });
}
let zSig = '';
async function loadZ(force){
  try {
    if (force) { $('#bSync').disabled = true; $('#bSync').textContent = 'Lendo…'; await api('POST', '/api/zabbix/sync'); }
    ZC = await api('GET', '/api/zabbix');
    const sig = ZC.synced + '|' + Object.values(ZC.hosts||{}).map(h=>(h.ifs||[]).map(f=>f.st).join('')).join('|');
    if (sig !== zSig) { zSig = sig; applyZ(); if (booted) { renderKPIs(); renderDetail(); renderTabs(); renderTable(); R3.rebuildAll(); R3.select(cur, undefined, true); } }
    if (force) toast('Zabbix lido agora');
    $('#bSync').title = ZC.erro ? 'Último erro do Zabbix: ' + ZC.erro : 'Ler o Zabbix agora';
  } catch (e) { if (force) toast('O Zabbix não respondeu: ' + e.message); }
  finally { $('#bSync').disabled = false; $('#bSync').textContent = 'Ler Zabbix'; }
}
$('#bSync').onclick = () => loadZ(true);
setInterval(() => { if (!document.hidden && booted) loadZ(false); }, 60000);

/* ---------- export / import ---------- */
function offer(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/octet-stream'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

$('#bCsv').onclick=()=>{

$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=async e=>{
  const f=e.target.files[0]; if(!f||!window.XLSX) return; const wb=XLSX.read(await f.arrayBuffer());
  let added=0, upd=0;
  wb.SheetNames.forEach(sn=>{
    if(/^INVENTARIO$/i.test(sn)) return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).slice(1).filter(r=>r.some(c=>String(c).trim()));
    const ports=rows.map(r=>{ const p={i:String(r[0]).trim(),d:String(r[1]).trim(),s:String(r[2]).trim(),o:String(r[3]).trim()}; p.st=ST_KEYS.includes(String(r[4]).trim())?String(r[4]).trim():guess(p); return p; });
    let d=S.devices.find(x=>x.name.toUpperCase()===sn.toUpperCase());
    if(d){ d.ports=ports; upd++; } else { S.devices.push({id:'d'+Date.now()+added,zabbix_hosts:[],name:sn,model:/F1A/i.test(sn)?'Huawei NetEngine 8000 F1A':/6750/.test(sn)?'Huawei S6750':'Huawei S6730',site:sn.split(' ').slice(1).join(' '),role:'',mgmt:'',notes:'',ports}); added++; }
  });
  e.target.value=''; applyZ(); markDirty(); refreshAll(); toast(`Importado: ${upd} atualizados, ${added} novos — clique em Salvar`);

function guess(p){ const t=(p.d+' '+p.s+' '+p.o).toUpperCase(); if(t.includes('PROTOCOL=DOWN'))return'PARCIAL'; if(t.includes('SHUTDOWN'))return'SHUTDOWN'; if(t.includes('DOWN'))return'DOWN'; return (p.d||p.s)?'UP':'N/D'; }

  function placeCam(){ cam.position.set(tgt.x+dist*Math.sin(phi)*Math.sin(theta), tgt.y+dist*Math.cos(phi), tgt.z+dist*Math.sin(phi)*Math.cos(theta)); cam.lookAt(tgt); }
  function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage);
  let drag=null, moved=0; const el=renderer.domElement;
  el.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,b:e.button||(e.shiftKey?2:0)}; moved=0; el.setPointerCapture(e.pointerId); });
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointermove',e=>{ if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved+=Math.abs(dx)+Math.abs(dy);
      if(drag.b===2){ camT.x-=dx*dist*.0016*Math.cos(theta); camT.y=Math.max(2,camT.y+dy*dist*.0012); }
      else { camT.theta-=dx*.006; camT.phi=Math.max(.35,Math.min(1.5,camT.phi-dy*.005)); }
      drag.x=e.clientX; drag.y=e.clientY; if(moved>4){ auto=false; updBtns(); } } hover(e); });
  el.addEventListener('pointerup',e=>{ const was=drag; drag=null; if(was&&moved<5) click(e); });
  el.addEventListener('pointerleave',()=>tip(null));
  el.addEventListener('wheel',e=>{ e.preventDefault(); camT.dist=Math.max(14,Math.min(260,camT.dist*(1+e.deltaY*.001))); },{passive:false});
  const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
  function pick(e){ const r=el.getBoundingClientRect(); mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mv,cam); const hits=ray.intersectObjects(world.children,true).filter(h=>h.object.userData&&h.object.userData.k!==undefined); return hits[0]&&hits[0].object.userData; }
  let hovLed=null;
  function hover(e){ if(drag) return; const u=pick(e); el.style.cursor=u?'pointer':'grab';
    if(hovLed){ hovLed.scale.set(1,1,1); hovLed=null; }
    if(u&&u.port){ const p=S.devices[u.k].ports[u.idx]; if(!p) return; const led=devs[u.k].leds.find(l=>l.userData.idx===u.idx); if(led){ led.scale.set(1.5,1.5,2); hovLed=led; }
      const z=p.z; tip(e,`<b>${esc(p.i)} <span style="color:${STATUS[p.st].c}">${STATUS[p.st].l}</span></b><div>${esc(p.d)||'—'}</div><div class="t">${esc(p.s)} · ${physSpeed(p.i)}</div>${z?`<div class="t">Zabbix: <span style="color:${z.st?STATUS[z.st].c:'inherit'}">${z.st||'—'}</span>${z.sp?' · '+z.sp:''}${z.rx?' · Rx '+z.rx+' / Tx '+z.tx+' dBm':''}${z.onus?' · '+z.onus+' ONUs, RX médio '+z.rxm+', pior '+z.worst+' dBm'+(+z.low?', '+z.low+' com sinal baixo':''):''}${isDiv(p)?' <span style="color:#ffb020">diverge do documentado</span>':''}</div>`:'<div class="t">Não monitorada no Zabbix</div>'}<div class="t">${esc(S.devices[u.k].name)} · ${esc(rackName(S.devices[u.k]))}</div>`); }
    else if(u){ const d=S.devices[u.k], c=counts(d.ports); tip(e,`<b>${esc(d.name)}</b><div class="t">${esc(d.model)} · ${esc(d.mgmt||'')}</div><div class="t">${esc(d.site)} · rack ${esc(rackName(d))}</div><div>${d.ports.length} interfaces · <span style="color:${STATUS.UP.c}">${c.UP} up</span> · <span style="color:${STATUS.DOWN.c}">${c.DOWN} down</span></div>`); }
    else tip(null);
  }
  function click(e){ const u=pick(e); if(!u) return; if(u.port){ select(u.k,{port:u.idx}); flashRow(u.idx); } else select(u.k); }
  function tip(e,h){ const t=$('#tip'); if(!e){ t.style.opacity=0; return; } t.innerHTML=h; t.style.opacity=1; const x=Math.min(innerWidth-t.offsetWidth-12,e.clientX+14), y=Math.min(innerHeight-t.offsetHeight-12,e.clientY+14); t.style.left=x+'px'; t.style.top=y+'px'; }
  function flashRow(idx){ if(!document.querySelector(`#tb tr[data-i="${idx}"]`)){ ['#q','#fSt','#fSvc','#fTp','#fZ'].forEach(s=>$(s).value=''); renderTable(); } const tr=document.querySelector(`#tb tr[data-i="${idx}"]`); if(!tr) return; tr.scrollIntoView({block:'center',behavior:'smooth'}); tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); }
  function updBtns(){ $('#bSpin').style.borderColor=auto?'var(--cyan)':''; $('#bLinks').style.borderColor=linkGrp.visible?'var(--cyan)':''; }
  $('#bSpin').onclick=()=>{ auto=!auto; updBtns(); };
  $('#bLinks').onclick=()=>{ linkGrp.visible=!linkGrp.visible; updBtns(); };
  $('#bReset').onclick=()=>{ camT.theta=-.35; siteSel=''; renderSites(); overview(); };

  let t0=performance.now();
  function loop(t){
    requestAnimationFrame(loop);
    const time=t/1000, intro=Math.min(1,(t-t0)/2200);
    if(auto && !drag){ camT.theta=-.35+Math.sin(time*.15)*.4; tourStep(t); }
    theta+=(camT.theta-theta)*.06; phi+=(camT.phi-phi)*.06; dist+=(camT.dist-dist)*.06; tgt.x+=(camT.x-tgt.x)*.06; tgt.y+=(camT.y-tgt.y)*.06;
    placeCam();
    devs.forEach((d,k)=>{ if(!d) return; const delay=(k%12)*.07; const e=Math.max(0,Math.min(1,(intro*1.6-delay)/.8)); const ease=1-Math.pow(1-e,3);
      const pull = k===selK ? 1.6 : 0; d.g.position.z += ((-(1-ease)*25 + pull) - d.g.position.z)*.12;
      d.so.material.opacity += ((k===selK? .6+.35*Math.sin(time*3):0) - d.so.material.opacity)*.15;
      d.leds.forEach(l=>{ if(l===hovLed||l===focusLed) return; const st=S.devices[k].ports[l.userData.idx]?.st; if(st==='UP'){ l.scale.z=Math.sin(time*6+l.userData.phase)>.6?1.25:1; } if(st==='DOWN'){ l.scale.setScalar(1+.15*Math.max(0,Math.sin(time*4+l.userData.phase))); } if(l.userData.ring) l.userData.ring.material.opacity=.45+.45*Math.abs(Math.sin(time*3)); });
    });
    if(focusLed){ focusLed.scale.set(1.7,1.7,2.4); }
    ledMats.UP.emissiveIntensity=.7+.25*Math.sin(time*2); ledMats.DOWN.emissiveIntensity=.5+.5*Math.abs(Math.sin(time*2.5));
    linkGrp.children.forEach(o=>{ if(o.userData.curve){ const u=(time*o.userData.speed+o.userData.off)%1; o.position.copy(o.userData.curve.getPoint(u)); } });
    parts.rotation.y=time*.01; parts.position.y=Math.sin(time*.3)*.5;
    rimL.intensity=1.1+.4*Math.sin(time*.8); rimR.intensity=1.1+.4*Math.cos(time*.7);
    renderer.render(scene,cam);
  }
  function init(){ rebuildAll(); overview(); theta=camT.theta; phi=camT.phi; dist=camT.dist*1.3; tourNext=performance.now()+4500; t0=performance.now(); resize(); updBtns(); requestAnimationFrame(loop); }

  let firstSel=true;
  return {
    init,
    select(k,portIdx,noFocus){ selK=k; if(focusLed){ focusLed.scale.set(1,1,1); focusLed=null; } if(portIdx!==undefined&&devs[k]) focusLed=devs[k].leds.find(l=>l.userData.idx===portIdx)||null; if(firstSel||noFocus){ firstSel=false; return; } focusRack(k); },
    rebuild(){ const k=selK; rebuildAll(); selK=k; },
    rebuildAll(){ rebuildAll(); },
    relabel(){ const k=selK; rebuildAll(); selK=k; },
    focusPort(k,idx){ if(focusLed) focusLed.scale.set(1,1,1); focusLed=devs[k]?devs[k].leds.find(l=>l.userData.idx===idx)||null:null; },
    focusSite(s){ focusSite(s); }
  };
})();

/* ---------- boot ---------- */
let booted = false;
(async function boot(){
  try {
    const r = await api('GET', '/api/dados');
    S = r.doc; REV = r.rev; CAN_EDIT = !!r.can_edit; USER = r.user;
    if (!Array.isArray(S.devices)) S.devices = [];
    document.body.classList.toggle('ro-mode', !CAN_EDIT);
    $('#user').innerHTML = r.login ? `<span>${esc(USER||'')}</span><a href="/logout">Sair</a>` : '';
    try { ZC = await api('GET', '/api/zabbix'); } catch(e) {}
    applyZ();
    if (!S.devices.length) S.devices.push({id:'d'+Date.now(),name:'NOVO EQUIPAMENTO',model:'',site:'',rack:'',role:'',mgmt:'',notes:'',zabbix_hosts:[],ports:[]});
    const want = decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
    let k0 = S.devices.findIndex(d => d.name.toLowerCase().replace(/\s+/g,'-') === want); if (k0 < 0) k0 = 0;
    R3.init();
    renderKPIs(); renderSites(); updSave(); select(k0,{fromUser:false}); booted = true;
    $('#boot').remove();
  } catch (e) {
    console.error(e);
    if (e.message !== 'login') $('#bootTxt').textContent = 'Não foi possível carregar a documentação: ' + e.message;
  }
})();

})();
</script>
