<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPDOWN · Documentação de Equipamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="/monograma.svg" type="image/svg+xml">
<script src="/vendor/three.min.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<style id="css">
:root{
  --bg:#05051a;--bg2:#0a0a2b;--panel:rgba(20,0,117,.22);--panel-solid:#0d0b36;--line:rgba(11,187,239,.18);--line2:rgba(255,255,255,.08);
  --blue:#0B0FEE;--navy:#140075;--cyan:#0BBBEF;--purple:#9B00FF;--ink:#eef0ff;--ink2:#a9adda;--ink3:#6c70a3;
  --up:#2fd67b;--down:#ff4d5e;--shut:#7a80a6;--part:#ffb020;--nd:#454a6e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
 radial-gradient(1200px 600px at 85% -10%,rgba(155,0,255,.18),transparent 60%),
 radial-gradient(900px 500px at -10% 10%,rgba(11,15,238,.22),transparent 60%),var(--bg)}
.mono{font-family:'JetBrains Mono',monospace}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
/* header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:46px;width:auto;display:block}
.brand-sep{width:1px;height:38px;background:linear-gradient(var(--cyan),var(--purple));opacity:.6}
.brand h1{margin:0;font-size:19px;letter-spacing:.02em;font-weight:700}
.brand h1 b{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--ink2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:rgba(11,15,238,.12);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--cyan);background:rgba(11,187,239,.15);box-shadow:0 0 18px rgba(11,187,239,.25)}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--purple));border-color:transparent}
.btn.primary:hover{box-shadow:0 0 24px rgba(155,0,255,.5)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--down);background:rgba(255,77,94,.12);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.user{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.user a{color:var(--ink3);text-decoration:none;border:1px solid var(--line2);padding:5px 9px;border-radius:8px}
.user a:hover{color:#fff;border-color:var(--cyan)}
.ro-mode .edit-only{display:none!important}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:80;color:var(--ink2);font-size:14px;text-align:center}
#boot img{height:56px;display:block;margin:0 auto 18px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.save-state{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
.dot.dirty{background:var(--part);box-shadow:0 0 8px var(--part)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;overflow:hidden;backdrop-filter:blur(8px)}
.kpi::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--c,var(--cyan)),transparent 70%);opacity:.18}
.kpi .lb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:32px;font-weight:700;margin-top:6px;line-height:1}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:4px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* grid */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(8px);position:relative}
.card h2{white-space:nowrap;margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.card .hd{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
#stage{position:relative;height:600px;overflow:hidden;border-radius:var(--r)}
#stage canvas{display:block;cursor:grab}
#stage canvas:active{cursor:grabbing}
.stage-hd{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;pointer-events:none}
.stage-hd>*{pointer-events:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.hint{position:absolute;bottom:12px;left:16px;font-size:11px;color:var(--ink3);z-index:2;pointer-events:none}
.ctrls{position:absolute;bottom:10px;right:12px;z-index:2;display:flex;gap:6px}
.ctrls .btn{padding:6px 10px;font-size:12px}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(8,6,40,.95);border:1px solid var(--cyan);border-radius:10px;padding:8px 11px;font-size:12px;max-width:320px;opacity:0;transition:opacity .12s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tip b{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:3px}
#tip .t{color:var(--ink2)}
/* detail */
.detail{padding:16px;display:flex;flex-direction:column;gap:14px;height:100%}
.dev-title{display:flex;align-items:flex-start;gap:12px}
.dev-title .ic{width:44px;height:44px;border-radius:12px;background:#1A1818;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.dev-title h3{margin:0;font-size:22px}
.dev-title p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.field input,.field textarea{width:100%;background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:13px;outline:none;transition:.15s}
.field input:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(11,187,239,.15)}
.field textarea{resize:vertical;min-height:52px}
.field.full{grid-column:1/-1}
.statbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:transparent}
.statbar div{height:100%;transition:flex .6s cubic-bezier(.2,.8,.2,1);min-width:0;cursor:default}
.statbar div:first-child{border-radius:7px 0 0 7px}.statbar div:last-child{border-radius:0 7px 7px 0}
.statleg{display:grid;grid-template-columns:repeat(5,auto);gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:8px;justify-content:start}
.statleg b{color:var(--ink);font-weight:600;margin-left:2px}
.svc{display:flex;flex-direction:column;gap:6px}
.svc .row{display:grid;grid-template-columns:120px 1fr 34px;align-items:center;gap:8px;font-size:12px}
.svc .row .n{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .row .b{height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.svc .row .b i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:0 4px 4px 0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.svc .row .c{text-align:right;font-family:'JetBrains Mono',monospace;color:var(--ink)}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
/* tabs + table */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 0}
.tab{padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(5,5,26,.4);cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;transition:.2s}
.tab:hover{border-color:var(--line)}
.tab.on{border-color:var(--cyan);background:rgba(11,187,239,.12);box-shadow:0 0 16px rgba(11,187,239,.2)}
.tab .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px}
.tab.empty .cnt{color:var(--ink3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.toolbar input[type=search],.toolbar select{background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;outline:none}
.toolbar input[type=search]{min-width:240px;flex:1;max-width:380px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--cyan)}
select option{background:#0d0b36}
.tbl-wrap{overflow:auto;max-height:620px;border-top:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#0b0930;z-index:1;text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--ink)}
tbody tr{border-bottom:1px solid var(--line2);transition:background .15s}
tbody tr:hover{background:rgba(11,187,239,.05)}
tbody tr.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:rgba(11,187,239,.28)}100%{background:transparent}}
td{padding:3px 6px;vertical-align:middle}
td input,td select{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 6px;font-size:13px;outline:none}
td input:hover{border-color:var(--line2)}
td input:focus,td select:focus{border-color:var(--cyan);background:rgba(5,5,26,.8)}
td.if input{font-family:'JetBrains Mono',monospace;font-size:12px}
td.st{width:132px}
td.st select{font-size:12px;font-weight:600;padding-left:22px;cursor:pointer;appearance:none;background-repeat:no-repeat;background-position:8px center;background-size:8px 8px}
td.tp{width:72px;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td.act{width:70px;text-align:center}
.x{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:11px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--down);background:rgba(255,77,94,.1)}
.empty-msg{padding:40px;text-align:center;color:var(--ink2)}
.empty-msg p{margin:6px 0 16px;color:var(--ink3)}
.foot{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line2)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,2,14,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:75}
.modal.on{display:grid}
.modal .box{background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 6px}
.modal p{color:var(--ink2);font-size:14px;margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal .field{margin-bottom:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--panel-solid);border:1px solid var(--cyan);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* cofre */
#vault{position:fixed;inset:0;z-index:65;display:none;background:rgba(2,2,14,.78);backdrop-filter:blur(6px)}
#vault.on{display:block}
#vault .vbox{position:absolute;inset:24px;max-width:1280px;margin:0 auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#vault .vhd{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
#vault .vhd img{width:30px;height:30px}
#vault .vhd h3{margin:0;font-size:18px}
#vault .vhd small{color:var(--ink3);font-size:12px;display:block}
#vault .vbody{flex:1;overflow:auto;padding:18px 20px}
.vlock{max-width:420px;margin:40px auto;text-align:center}
.vlock img{width:72px;height:72px;margin-bottom:10px}
.vlock h4{margin:6px 0 6px;font-size:20px}
.vlock p{color:var(--ink2);font-size:13px;line-height:1.5;margin:0 0 16px}
.vlock input{width:100%;background:rgba(5,5,26,.7);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:10px;outline:none}
.vlock input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(11,187,239,.15)}
.vlock .err{color:var(--down);font-size:13px;min-height:18px;margin-bottom:8px}
.vlock .btn{width:100%;justify-content:center;padding:11px}
.vtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.vtool input[type=search],.vtool select{background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:13px;outline:none}
.vtool input[type=search]{flex:1;min-width:220px;max-width:360px}
.vcat{margin:6px 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:18px}
.ventry{background:rgba(5,5,26,.55);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px}
.ventry.hl{border-color:var(--cyan);box-shadow:0 0 16px rgba(11,187,239,.25)}
.ventry h5{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ventry h5 span{word-break:break-word}
.vrow{display:grid;grid-template-columns:78px 1fr auto;gap:6px;align-items:center;padding:3px 0;border-top:1px dashed rgba(255,255,255,.05)}
.vrow:first-of-type{border-top:none}
.vrow .k{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.vrow .v{font-family:'JetBrains Mono',monospace;font-size:12px;word-break:break-all}
.vrow .v a{color:var(--cyan);text-decoration:none}
.vrow .v a:hover{text-decoration:underline}
.vrow .acts{display:flex;gap:4px}
.lk{background:none;border:1px solid var(--line2);color:var(--ink2);font-size:11px;padding:2px 7px;border-radius:6px;cursor:pointer}
.lk:hover{border-color:var(--cyan);color:#fff}
.vnote{color:var(--ink2);font-size:12px;white-space:pre-wrap;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.06)}
.vdevs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.vdevs span{font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(11,187,239,.12);border:1px solid var(--line);cursor:pointer}
.vform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vform .field.full{grid-column:1/-1}
.vform .devpick{display:flex;flex-wrap:wrap;gap:6px;max-height:120px;overflow:auto;padding:6px;border:1px solid var(--line2);border-radius:8px}
.vform .devpick label{font-size:12px;display:flex;gap:4px;align-items:center;color:var(--ink2)}
.vform .extra{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:6px;align-items:center;margin-bottom:6px}
.vform .extra input{width:100%;background:rgba(5,5,26,.6);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:12px}
.vempty{color:var(--ink3);text-align:center;padding:40px}
.dev-acc{display:flex;flex-direction:column;gap:6px}
.dev-acc .ventry{padding:10px 12px}
.hidden{display:none!important}
.sites{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(5,5,26,.55);font-size:12px;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--line)}
.chip.on{border-color:var(--cyan);background:rgba(11,187,239,.14);color:#fff}
.tabgrp{display:flex;flex-direction:column;gap:6px;padding-right:10px;margin-right:4px;border-right:1px solid var(--line2)}
.tabgrp:last-child{border-right:none}
.tabgrp .gl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.tabgrp .gl{color:var(--cyan)}
.tabgrp .row{display:flex;gap:6px;flex-wrap:wrap}
td.zb{width:150px;font-size:12px;white-space:nowrap;color:var(--ink2)}
td.zb .zd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
td.zb .warn{color:#1A1818;background:var(--part);font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;margin-left:5px;cursor:help}
td.opt{width:118px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink2);white-space:nowrap}
td.opt .lo{color:var(--part)}
.lowb{font-size:10px;color:var(--part)}
.badge{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:rgba(155,0,255,.2);color:#d9a6ff;margin-left:6px;vertical-align:middle}
.ro{font-size:12px;color:var(--ink2);padding:7px 9px;background:rgba(5,5,26,.35);border:1px dashed var(--line2);border-radius:8px;min-height:32px;word-break:break-all}
.zbx-line{font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.zbx-line .dot{width:6px;height:6px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}#stage{height:440px}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.toolbar input[type=search]{min-width:0}}
</style>
</head>
<body>
<template id="shell">
<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo" src="/logo-updown.png" alt="UPDOWN Internet" width="180" height="54">
      <div class="brand-sep"></div>
      <div><h1>Documentação de equipamentos</h1><small>NOC · roteadores, switches e DWDM</small></div>
    </div>
    <div class="spacer"></div>
    <div class="save-state"><span class="dot" id="dot"></span><span id="saveTxt">Carregando…</span></div>
    <button class="btn" id="bCofre" title="Seu cofre de acessos (pessoal, cifrado)">Meu cofre</button>
    <button class="btn ghost" id="bSync" title="Ler o Zabbix agora">Ler Zabbix</button>
    <button class="edit-only btn" id="bImport" title="Importar uma planilha no mesmo formato (uma aba por equipamento)">Importar XLSX</button>
    <input type="file" id="fImport" accept=".xlsx,.xls" class="hidden">
    <button class="btn" id="bXlsx">Exportar XLSX</button>
    <button class="btn" id="bCsv">Exportar CSV</button>
    <button class="edit-only btn primary" id="bSave">Salvar alterações</button>
    <div class="user" id="user"></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card">
      <div id="stage">
        <div class="stage-hd">
          <h2>Racks por site</h2>
          <div class="sites" id="sites"></div>
          <div class="spacer"></div>
          <div class="legend" id="legend3d"></div>
        </div>
        <div class="hint">Arraste para girar · botão direito move · role para zoom · clique num equipamento ou porta</div>
        <div class="ctrls">
          <button class="btn ghost" id="bSpin">Auto-giro</button>
          <button class="btn ghost" id="bLinks">Enlaces</button>
          <button class="btn ghost" id="bReset">Centralizar</button>
        </div>
      </div>
    </div>
    <div class="card"><div class="detail" id="detail"></div></div>
  </section>

  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Buscar interface, destino, serviço, observação…">
      <select id="fSt"><option value="">Todos os status</option></select>
      <select id="fSvc"><option value="">Todos os serviços</option></select>
      <select id="fTp"><option value="">Física e lógica</option><option value="F">Somente físicas</option><option value="L">Somente lógicas</option></select>
      <select id="fZ"><option value="">Zabbix: todas</option><option value="div">Divergem do Zabbix</option><option value="mon">Monitoradas no Zabbix</option><option value="nomon">Fora do Zabbix</option><option value="new">Importadas do Zabbix</option></select>
      <div class="spacer"></div>
      <button class="edit-only btn hidden" id="bZnew" title="Interfaces que existem no Zabbix e ainda não estão nesta documentação">Importar <span></span> do Zabbix</button>
      <button class="edit-only btn" id="bAddRow">Nova interface</button>
      <button class="edit-only btn" id="bAddDev">Novo equipamento</button>
      <button class="edit-only btn danger" id="bDelDev">Excluir equipamento</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-k="i">Interface</th><th data-k="tp">Tipo</th><th data-k="d">Destino</th><th data-k="s">Serviço</th><th data-k="o">Observação</th><th data-k="st">Status (doc.)</th><th data-k="zst">Zabbix</th><th data-k="rx">Rx / Tx dBm</th><th></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty-msg hidden" id="emptyMsg"><b>Nenhuma interface documentada</b><p>Esta aba estava vazia na planilha. Adicione as interfaces aqui ou importe a planilha atualizada.</p><button class="edit-only btn primary" id="bAddRow2">Adicionar interface</button></div>
    </div>
    <div class="foot"><span id="footL"></span><span id="footR"></span></div>
  </section>
</div>
<div id="vault" role="dialog" aria-modal="true" aria-label="Cofre de acessos"><div class="vbox">
  <div class="vhd"><img src="/monograma.svg" alt=""><div><h3 id="vTitle">Cofre de acessos</h3><small id="vSub">Pessoal: cada usuário do portal tem o seu</small></div><div class="spacer"></div>
    <span class="save-state hidden" id="vState"><span class="dot dirty"></span>Alterações não salvas</span>
    <button class="btn primary hidden" id="vSave">Salvar cofre</button>
    <button class="btn hidden" id="vLockBtn">Trancar</button>
    <button class="btn ghost" id="vClose">Fechar</button></div>
  <div class="vbody" id="vBody"></div>
</div></div>
<input type="file" id="vFile" accept=".json,application/json" class="hidden">
<div id="tip"></div>
<div id="boot"><div><img src="/logo-updown.png" alt=""><span id="bootTxt">Carregando a documentação…</span></div></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
</template>
<script id="app">
(function(){
'use strict';
const SHELL = document.getElementById('shell');
document.body.appendChild(SHELL.content.cloneNode(true));

let S = {devices:[]}, REV = 1, CAN_EDIT = false, USER = null, ZC = {hosts:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STATUS = {
  'UP':{c:'#2fd67b',l:'Up'},
  'DOWN':{c:'#ff4d5e',l:'Down'},
  'PARCIAL':{c:'#ffb020',l:'Proto down'},
  'SHUTDOWN':{c:'#7a80a6',l:'Shutdown'},
  'N/D':{c:'#454a6e',l:'Sem status'}
};
const ST_KEYS = Object.keys(STATUS);
const isPhys = i => (/^(\d+GE|XGE|GE|MEth|10GE|40GE)\d/i.test(i) || /^(hundred|four-hundred)-g|^(gpon|xgei|gei)_\d/i.test(i)) && !/\.\d+/.test(i.replace(/\(.*\)/,''));
const physSpeed = i => { if(/^gpon_/i.test(i)) return 'GPON'; if(/^xgei_/i.test(i)) return '10G'; if(/^gei_/i.test(i)) return '1G'; const m=i.match(/^(\d+)GE/i); if(m) return m[1]+'G'; if(/^XGE/i.test(i)) return '10G'; if(/^MEth/i.test(i)) return 'MGMT'; const p=i.match(/\((\d+\w)\)/); return p?p[1]:'1G'; };

let cur = 0, dirty = false, sortK = null, sortDir = 1;
const isDiv = p => !!(p.z && p.z.st && p.st !== 'N/D' && ((p.st === 'UP') !== (p.z.st === 'UP')));
const rackKey = d => (d.site || 'Sem site') + '||' + (d.rack || '');
const rackName = d => d.rack || 'Sem localização no Zabbix';

/* ---------- servidor ---------- */
async function api(method, url, body){
  const r = await fetch(url, {method, headers: body?{'Content-Type':'application/json'}:{}, body: body?JSON.stringify(body):undefined, credentials:'same-origin'});
  if (r.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.hash); throw new Error('login'); }
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const e = new Error((j && (j.error || j.erro)) || ('HTTP ' + r.status)); e.status = r.status; e.data = j; throw e; }
  return j;
}
function markDirty(){ if(!CAN_EDIT) return; dirty = true; updSave(); }
function updSave(){
  $('#dot').classList.toggle('dirty', dirty);
  $('#saveTxt').textContent = !CAN_EDIT ? 'Somente consulta' : dirty ? 'Alterações não salvas' : 'Tudo salvo';
  $('#bSave').disabled = !dirty;
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),3200); }
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
function cleanDoc(){ const d = JSON.parse(JSON.stringify(S, (k,v)=> (k==='z'||k==='_znew'||k==='_zh') ? undefined : v)); return d; }
async function save(){
  if(!dirty || !CAN_EDIT) return;
  $('#saveTxt').textContent = 'Salvando…'; $('#bSave').disabled = true;
  try {
    const r = await api('PUT', '/api/dados', {rev: REV, doc: cleanDoc()});
    REV = r.rev; S.rev = r.rev; S.updated = r.updated; S.updated_by = r.updated_by; dirty = false; updSave(); renderTable();
    toast('Documentação salva (versão ' + r.rev + ')');
    setTimeout(()=>loadZ(false), 4000);
  } catch (e) {
    if (e.status === 409) {
      const by = e.data && e.data.updated_by ? e.data.updated_by : 'outra pessoa';
      modal(`<h3>Alguém salvou antes de você</h3><p>${esc(by)} salvou uma versão nova enquanto você editava. Recarregue para ver a versão atual (o que você não salvou se perde) ou baixe antes um XLSX com o que está na sua tela.</p><div class="acts"><button class="btn ghost" id="cfX">Baixar XLSX</button><button class="btn primary" id="cfR">Recarregar</button></div>`);
      $('#cfX').onclick = () => $('#bXlsx').click(); $('#cfR').onclick = () => { dirty = false; location.reload(); };
    } else toast('Não foi possível salvar: ' + e.message);
    updSave();
  }
}

/* ---------- Zabbix (status ao vivo; não é gravado na documentação) ---------- */
const normIf = n => String(n||'').replace(/\(.*?\)/g,'').trim().replace('XGigabitEthernet','XGE').replace('GigabitEthernet','GE').toUpperCase();
function zIndex(d){
  const idx = {}; (d.zabbix_hosts||[]).forEach((hn, hi) => { const H = ZC.hosts && ZC.hosts[hn]; if (!H) return;
    (H.ifs||[]).forEach(f => { const k = normIf(f.i), e = idx[k];
      const z = {st:f.st||'', sp:f.sp||'', rx:f.rx||'', tx:f.tx||'', a:f.a||'', i:f.i}; if (hi>0) z.vs = 1;
      if (f.onus !== undefined) { z.onus = f.onus; z.rxm = f.rxm||''; z.low = f.low||''; z.worst = f.worst||''; }
      if (!e) idx[k] = z; else { for (const c of ['st','sp','rx','tx','a']) if (!e[c] && z[c]) e[c] = z[c]; } }); });
  return idx;
}
function zHost(d){ return (d.zabbix_hosts||[]).map(n => ZC.hosts && ZC.hosts[n]).filter(Boolean)[0] || null; }
function applyZ(){
  S.devices.forEach(d => { const idx = zIndex(d); d._znew = [];
    const have = new Set(d.ports.map(p => normIf(p.i)));
    d.ports.forEach(p => { const z = idx[normIf(p.i)]; if (z) p.z = z; else delete p.z; });
    Object.entries(idx).forEach(([k, z]) => { if (!have.has(k)) d._znew.push(z); });
    const H = zHost(d); d._zh = H ? {sysname:H.sysname, location:H.location, version:H.version, model:H.model, ip:H.ip, ping:H.ping} : null; });
}
let zSig = '';
async function loadZ(force){
  try {
    if (force) { $('#bSync').disabled = true; $('#bSync').textContent = 'Lendo…'; await api('POST', '/api/zabbix/sync'); }
    ZC = await api('GET', '/api/zabbix');
    const sig = ZC.synced + '|' + Object.values(ZC.hosts||{}).map(h=>(h.ifs||[]).map(f=>f.st).join('')).join('|');
    if (sig !== zSig) { zSig = sig; applyZ(); if (booted) { renderKPIs(); renderDetail(); renderTabs(); renderTable(); R3.rebuildAll(); R3.select(cur, undefined, true); } }
    if (force) toast('Zabbix lido agora');
    $('#bSync').title = ZC.erro ? 'Último erro do Zabbix: ' + ZC.erro : 'Ler o Zabbix agora';
  } catch (e) { if (force) toast('O Zabbix não respondeu: ' + e.message); }
  finally { $('#bSync').disabled = false; $('#bSync').textContent = 'Ler Zabbix'; }
}
$('#bSync').onclick = () => loadZ(true);
setInterval(() => { if (!document.hidden && booted) loadZ(false); }, 60000);

/* ---------- KPIs ---------- */
function counts(ports){ const c={}; ST_KEYS.forEach(k=>c[k]=0); ports.forEach(p=>c[p.st]=(c[p.st]||0)+1); return c; }
function animNum(el, to){
  const from = +el.dataset.v || 0; el.dataset.v = to; const t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/700), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e).toLocaleString('pt-BR'); if(k<1) requestAnimationFrame(f); })(t0);
}
function renderKPIs(){
  const all = S.devices.flatMap(d=>d.ports);
  const c = counts(all);
  const doc = S.devices.filter(d=>d.ports.length).length;
  const phys = all.filter(p=>isPhys(p.i)).length;
  const sites = new Set(S.devices.map(d=>d.site||'')).size, racks = new Set(S.devices.map(rackKey)).size;
  const mon = all.filter(p=>p.z).length, dv = all.filter(isDiv).length;
  const items = [
    {k:'eq', lb:'Equipamentos', v:S.devices.length, s:sites+' sites · '+racks+' racks', c:'#0BBBEF'},
    {k:'if', lb:'Interfaces', v:all.length, s:phys+' físicas · '+mon+' no Zabbix', c:'#9B00FF'},
    {k:'UP', lb:'Up', v:c.UP, s:pct(c.UP,all.length)+' do total', c:STATUS.UP.c, sw:true},
    {k:'DOWN', lb:'Down', v:c.DOWN+c.PARCIAL, s:c.PARCIAL+' com PHY up / protocolo down', c:STATUS.DOWN.c, sw:true},
    {k:'SHUTDOWN', lb:'Shutdown', v:c.SHUTDOWN, s:'portas livres/desativadas', c:STATUS.SHUTDOWN.c, sw:true},
    {k:'div', lb:'Divergem do Zabbix', v:dv, s:'status documentado diferente do atual', c:STATUS.PARCIAL.c, sw:true},
  ];
  const box = $('#kpis');
  if(!box.children.length) box.innerHTML = items.map(i=>`<div class="kpi" style="--c:${i.c}"><div class="lb">${i.sw?`<span class="sw" style="background:${i.c}"></span>`:''}${i.lb}</div><div class="v mono" id="kv-${i.k}">0</div><div class="s" id="ks-${i.k}"></div></div>`).join('');
  items.forEach(i=>{ animNum(document.getElementById('kv-'+i.k), i.v); document.getElementById('ks-'+i.k).textContent=i.s; });
}
const pct=(a,b)=>b?Math.round(a*100/b)+'%':'0%';

/* ---------- detail panel ---------- */
function renderDetail(){
  const d = S.devices[cur]; const c = counts(d.ports); const n = d.ports.length;
  const svc = {}; d.ports.forEach(p=>{ let s=(p.s||'—').trim().toUpperCase(); if(/SHUTDOWN|INTERFACE EM|^INTERACE|PHY=UP/.test(s)) return; svc[s]=(svc[s]||0)+1; });
  const top = Object.entries(svc).sort((a,b)=>b[1]-a[1]).slice(0,7); const mx = top.length?top[0][1]:1;
  const phys = d.ports.filter(p=>isPhys(p.i)).length;
  $('#detail').innerHTML = `
    <div class="dev-title"><div class="ic"><img src="/monograma.svg" alt="" width="30" height="30"></div>
      <div><h3>${esc(d.name)}</h3><p>${esc(d.model)} · ${esc(d.site)} · ${esc(rackName(d))}</p></div></div>
    <div class="fields">
      <div class="field"><label>Nome / aba</label><input data-f="name" value="${esc(d.name)}"></div>
      <div class="field"><label>Modelo</label><input data-f="model" value="${esc(d.model)}"></div>
      <div class="field"><label>Site / POP</label><input data-f="site" value="${esc(d.site)}"></div>
      <div class="field"><label>Rack</label><input data-f="rack" placeholder="Sem localização no Zabbix" value="${esc(d.rack)}"></div>
      <div class="field"><label>Função</label><input data-f="role" value="${esc(d.role)}"></div>
      <div class="field"><label>IP de gerência</label><input data-f="mgmt" class="mono" placeholder="ex.: 10.0.0.1" value="${esc(d.mgmt)}"></div>
      <div class="field full"><label>Host(s) no Zabbix · um por linha</label><textarea data-f="zabbix_hosts" class="mono" rows="2" placeholder="Nome do host no Zabbix">${esc((d.zabbix_hosts||[]).join('\n'))}</textarea></div>
      ${d._zh?`<div class="field full"><label>Zabbix agora · sysName / sysLocation / versão</label><div class="ro mono">${esc(d._zh.sysname||'—')} · ${esc(d._zh.location||'—')} · ${esc(d._zh.version||'—')}${d._zh.ip&&d._zh.ip!==d.mgmt?' · IP no Zabbix '+esc(d._zh.ip):''}</div></div>`:((d.zabbix_hosts||[]).length?`<div class="field full"><div class="ro" style="color:var(--part)">Host não encontrado no Zabbix: confira o nome acima.</div></div>`:'')}
      <div class="field full"><label>Notas</label><textarea data-f="notes" placeholder="Localização no rack, contrato, serial…">${esc(d.notes)}</textarea></div>
    </div>
    ${devAccessHtml(d)}
    <div>
      <div class="sub">Status das ${n} interfaces · ${phys} físicas</div>
      ${n?`<div class="statbar">${ST_KEYS.filter(k=>c[k]).map(k=>`<div title="${STATUS[k].l}: ${c[k]}" style="flex:${c[k]};background:${STATUS[k].c}"></div>`).join('')}</div>
      <div class="statleg">${ST_KEYS.map(k=>`<span><span class="sw" style="background:${STATUS[k].c}"></span> ${k==='PARCIAL'?'Proto down':STATUS[k].l}<b class="mono">${c[k]}</b></span>`).join('')}</div>`:'<div style="color:var(--ink3);font-size:13px">Sem interfaces documentadas.</div>'}
    </div>
    ${top.length?`<div><div class="sub">Serviços (sem portas desativadas)</div><div class="svc">${top.map(([k,v])=>`<div class="row"><span class="n" title="${esc(k)}">${esc(k)}</span><span class="b"><i style="width:0" data-w="${v/mx*100}"></i></span><span class="c">${v}</span></div>`).join('')}</div></div>`:''}
  `;
  requestAnimationFrame(()=>document.querySelectorAll('.svc i').forEach(i=>i.style.width=i.dataset.w+'%'));
  if(!CAN_EDIT) $('#detail').querySelectorAll('input,textarea').forEach(el=>el.readOnly=true);
  bindDevAccess();
  $('#detail').querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',()=>{
    if(el.dataset.f==='zabbix_hosts'){ d.zabbix_hosts=el.value.split('\n').map(s=>s.trim()).filter(Boolean); markDirty(); return; }
    d[el.dataset.f]=el.value; markDirty();
    if(el.dataset.f==='name'){ renderTabs(); R3.relabel(cur); }
    if(el.dataset.f==='model'){ $('#detail h3').nextElementSibling.textContent=d.model+' · '+d.site+' · '+rackName(d); R3.relabel(cur); }
    if(el.dataset.f==='site'||el.dataset.f==='rack'){ $('#detail h3').nextElementSibling.textContent=d.model+' · '+d.site+' · '+rackName(d); clearTimeout(renderDetail._t); renderDetail._t=setTimeout(()=>{ renderTabs(); renderKPIs(); renderSites(); R3.rebuildAll(); R3.select(cur); },700); }
  }));
}

/* ---------- tabs ---------- */
function renderTabs(){
  const grp = {}; S.devices.forEach((d,k)=>{ (grp[d.site||'Sem site']=grp[d.site||'Sem site']||[]).push(k); });
  $('#tabs').innerHTML = Object.entries(grp).map(([s,ks])=>`<div class="tabgrp"><div class="gl">${esc(s)}</div><div class="row">${ks.map(k=>{const d=S.devices[k]; return `<div class="tab ${k===cur?'on':''} ${d.ports.length?'':'empty'}" data-k="${k}" title="Rack: ${esc(rackName(d))}">${esc(d.name)} <span class="cnt">${d.ports.length}</span></div>`;}).join('')}</div></div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>select(+t.dataset.k));
}
function select(k, opts={}){
  cur = k; try{ history.replaceState(null,'','#'+S.devices[k].name.toLowerCase().replace(/\s+/g,'-')); }catch(e){}
  if(typeof siteSel!=='undefined' && opts.fromUser!==false){ siteSel=S.devices[k].site||''; try{renderSites();}catch(e){} } renderTabs(); renderDetail(); renderFilters(); renderTable(); R3.select(k, opts.port);
}

/* ---------- filters ---------- */
function renderFilters(){
  const d=S.devices[cur];
  const st=$('#fSt'), sv=$('#fSvc'); const a=st.value, b=sv.value;
  st.innerHTML='<option value="">Todos os status</option>'+ST_KEYS.map(k=>`<option value="${k}">${STATUS[k].l}</option>`).join('');
  const svcs=[...new Set(d.ports.map(p=>(p.s||'').trim()).filter(Boolean))].sort();
  sv.innerHTML='<option value="">Todos os serviços</option>'+svcs.map(s=>`<option>${esc(s)}</option>`).join('');
  st.value=a; if(svcs.includes(b)) sv.value=b; else sv.value='';
}

/* ---------- table ---------- */
function zCell(p){ if(!p.z) return '<span style="color:var(--ink3)">não monitorada</span>'; const z=p.z; const c=z.st?STATUS[z.st].c:STATUS['N/D'].c;
  return `<span class="zd" style="background:${c}"></span>${z.st||'—'}${z.sp?' · '+z.sp:''}${z.onus!==undefined&&z.onus!==''?' · '+z.onus+' ONUs'+(+z.low?' <span class="lowb" title="ONUs com sinal baixo">'+z.low+' baixo</span>':''):''}${z.vs?' <span class="badge">VS</span>':''}${isDiv(p)?'<span class="warn" title="Documentado como '+STATUS[p.st].l+', Zabbix diz '+z.st+'">diverge</span>':''}`; }
function optCell(p){ if(!p.z) return ''; const lo=v=>v!==''&&+v<-14?'lo':''; let s='';
  if(/^gpon_/i.test(p.i)) { if(p.z.tx) s=`TX ${p.z.tx}`; }
  else if(p.z.rx||p.z.tx) s=`<span class="${lo(p.z.rx)}">${p.z.rx||'—'}</span> / ${p.z.tx||'—'}`;
  if(p.z.rxm) s+=`${s?'<br>':''}<span title="RX médio das ONUs · pior ONU ${esc(p.z.worst||'—')} dBm" class="${+p.z.rxm<-25?'lo':''}">ONUs ${p.z.rxm}</span>`;
  return s; }
function stBg(k){ return `background-image:radial-gradient(circle,${STATUS[k].c} 60%,transparent 62%);color:${STATUS[k].c}`; }
function visibleRows(){
  const d=S.devices[cur]; const q=$('#q').value.trim().toLowerCase(), fs=$('#fSt').value, fv=$('#fSvc').value, ft=$('#fTp').value, fz=$('#fZ').value;
  let rows=d.ports.map((p,idx)=>({p,idx})).filter(({p})=>
    (!q || (p.i+' '+p.d+' '+p.s+' '+p.o).toLowerCase().includes(q)) &&
    (!fs || p.st===fs) && (!fv || (p.s||'').trim()===fv) &&
    (!ft || (ft==='F')===isPhys(p.i)) &&
    (!fz || (fz==='div'&&isDiv(p)) || (fz==='mon'&&p.z) || (fz==='nomon'&&!p.z) || (fz==='new'&&p.src==='zabbix')));
  const sv=(p)=> sortK==='tp'?(isPhys(p.i)?'F':'L') : sortK==='zst'?((p.z&&p.z.st)||'~') : sortK==='rx'?String((p.z&&p.z.rx)||'~') : (p[sortK]||'');
  if(sortK){ rows.sort((a,b)=> sv(a.p).localeCompare(sv(b.p),'pt-BR',{numeric:true})*sortDir); }
  return rows;
}
function renderTable(){
  const d=S.devices[cur]; const rows=visibleRows();
  $('#emptyMsg').classList.toggle('hidden', d.ports.length>0);
  $('#tb').innerHTML = rows.map(({p,idx})=>`<tr data-i="${idx}">
    <td class="if"><input data-k="i" value="${esc(p.i)}" title="${p.src==='zabbix'?'Importada do Zabbix':''}"></td>
    <td class="tp">${isPhys(p.i)?'Física':'Lógica'}</td>
    <td><input data-k="d" value="${esc(p.d)}"></td>
    <td><input data-k="s" value="${esc(p.s)}"></td>
    <td><input data-k="o" value="${esc(p.o)}"></td>
    <td class="st"><select data-k="st" style="${stBg(p.st)}">${ST_KEYS.map(k=>`<option value="${k}" ${k===p.st?'selected':''}>${STATUS[k].l}</option>`).join('')}</select></td>
    <td class="zb">${zCell(p)}</td>
    <td class="opt">${optCell(p)}</td>
    <td class="act"><button class="x" title="Remover esta interface">remover</button></td></tr>`).join('');
  if(!CAN_EDIT){ $('#tb').querySelectorAll('input').forEach(el=>el.readOnly=true); $('#tb').querySelectorAll('select').forEach(el=>el.disabled=true); $('#tb').querySelectorAll('.x').forEach(el=>el.remove()); }
  const zn=$('#bZnew'); zn.classList.toggle('hidden', !(d._znew&&d._znew.length)); if(d._znew) zn.querySelector('span').textContent=d._znew.length+' interface'+(d._znew.length>1?'s':'');
  $('#footL').textContent = `Mostrando ${rows.length} de ${d.ports.length} interfaces`;
  $('#footR').textContent = (ZC.synced?'Zabbix lido em '+new Date(ZC.synced).toLocaleString('pt-BR')+' · ':'Zabbix ainda não lido · ')+'Versão '+REV+(S.updated?' salva em '+new Date(S.updated).toLocaleString('pt-BR'):'')+(S.updated_by?' por '+S.updated_by:'');
}
$('#tb').addEventListener('input', e=>{
  const el=e.target, tr=el.closest('tr'); if(!tr) return; const p=S.devices[cur].ports[+tr.dataset.i];
  p[el.dataset.k]=el.value; markDirty();
  if(el.dataset.k==='st'){ el.setAttribute('style',stBg(el.value)); }
  if(el.dataset.k==='i'){ tr.querySelector('.tp').textContent=isPhys(p.i)?'Física':'Lógica'; }
  debounceRefresh();
});

/* ---------- export / import ---------- */
function offer(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: /\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/octet-stream'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

$('#fImport').onchange=async e=>{
  const f=e.target.files[0]; if(!f||!window.XLSX) return; const wb=XLSX.read(await f.arrayBuffer());
  let added=0, upd=0;
  wb.SheetNames.forEach(sn=>{
    if(/^INVENTARIO$/i.test(sn)) return;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).slice(1).filter(r=>r.some(c=>String(c).trim()));
    const ports=rows.map(r=>{ const p={i:String(r[0]).trim(),d:String(r[1]).trim(),s:String(r[2]).trim(),o:String(r[3]).trim()}; p.st=ST_KEYS.includes(String(r[4]).trim())?String(r[4]).trim():guess(p); return p; });
    let d=S.devices.find(x=>x.name.toUpperCase()===sn.toUpperCase());
    if(d){ d.ports=ports; upd++; } else { S.devices.push({id:'d'+Date.now()+added,zabbix_hosts:[],name:sn,model:/F1A/i.test(sn)?'Huawei NetEngine 8000 F1A':/6750/.test(sn)?'Huawei S6750':'Huawei S6730',site:sn.split(' ').slice(1).join(' '),role:'',mgmt:'',notes:'',ports}); added++; }
  });
  e.target.value=''; applyZ(); markDirty(); refreshAll(); toast(`Importado: ${upd} atualizados, ${added} novos — clique em Salvar`);
};
function guess(p){ const t=(p.d+' '+p.s+' '+p.o).toUpperCase(); if(t.includes('PROTOCOL=DOWN'))return'PARCIAL'; if(t.includes('SHUTDOWN'))return'SHUTDOWN'; if(t.includes('DOWN'))return'DOWN'; return (p.d||p.s)?'UP':'N/D'; }

/* ---------- cofre de acessos (cifrado no navegador; o servidor só guarda o conteúdo cifrado) ---------- */
const V = {key:null, salt:null, iter:600000, rev:0, blob:null, data:null, dirty:false, canEdit:false, meta:null, q:'', cat:'', edit:null, hl:null, show:new Set(), t:null};
const VCATS = ['Equipamentos de rede (SSH)','Servidores e infraestrutura','Monitoramento','Sistemas e painéis','Telefonia','Operadoras e fornecedores','E-mails','Outros'];
const hasCrypto = !!(window.crypto && crypto.subtle && window.isSecureContext);
function b64e(buf){ const a=new Uint8Array(buf); let s=''; for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000)); return btoa(s); }
function b64d(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function vDerive(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function vLoad(){
  try { const r = await api('GET','/api/cofre'); V.rev=r.rev; V.blob=r.blob; V.canEdit=true; V.meta=r; V.dono=r.dono||USER||''; V.legado=!!r.legado; V.err=null; }
  catch(e) { V.err = e.status===403 ? e.message : ('Não foi possível carregar o cofre: '+e.message); }
}
async function vEncrypt(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, V.key, new TextEncoder().encode(JSON.stringify(V.data)));
  return {alg:'AES-GCM', kdf:'PBKDF2-SHA256', iter:V.iter, salt:b64e(V.salt), iv:b64e(iv), ct:b64e(ct)};
}
async function vSaveNow(){
  if(!V.key || !V.dirty) return true;
  try {
    const blob = await vEncrypt();
    const r = await api('PUT','/api/cofre',{rev:V.rev, blob});
    V.rev = r.rev; V.blob = blob; V.dirty = false; vRender(); toast('Cofre salvo (cifrado)'); return true;
  } catch(e) {
    if (e.status===409) toast('O seu cofre foi salvo em outra aba ou computador. Tranque, abra de novo e refaça a alteração.');
    else toast('Não foi possível salvar o cofre: '+e.message);
    return false;
  }
}
function vDirty(){ V.dirty=true; vRender(); }
function vLock(){ V.key=null; V.data=null; V.edit=null; V.show.clear(); V.dirty=false; clearTimeout(V.t); vRender(); R3.safeState(false); if(booted) renderDetail(); }
function vTouch(){ clearTimeout(V.t); if(V.key) V.t=setTimeout(async()=>{ if(V.dirty) await vSaveNow(); vLock(); toast('Cofre trancado por inatividade'); }, 10*60*1000); }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ if(V.key) vTouch(); }));
async function openVault(hlId){
  V.hl = hlId || null;
  $('#vault').classList.add('on'); await vLoad(); vRender();
  if (V.hl) setTimeout(()=>{ const el=document.querySelector(`.ventry[data-id="${V.hl}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }, 80);
}
function closeVault(){ $('#vault').classList.remove('on'); }
$('#vClose').onclick=closeVault;
$('#vLockBtn').onclick=async()=>{ if(V.dirty && !(await vSaveNow())) return; vLock(); };
$('#vSave').onclick=vSaveNow;
$('#vault').addEventListener('click',e=>{ if(e.target.id==='vault') closeVault(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#vault').classList.contains('on') && !$('#modal').classList.contains('on')) closeVault(); });
window.addEventListener('beforeunload', e => { if (V.dirty) { e.preventDefault(); e.returnValue=''; } });

function devName(id){ const d=S.devices.find(x=>x.id===id); return d?d.name:'(equipamento removido)'; }
function vRender(){
  const body=$('#vBody'); const un=!!V.key;
  $('#vLockBtn').classList.toggle('hidden',!un); $('#vSave').classList.toggle('hidden',!(un&&V.dirty)); $('#vState').classList.toggle('hidden',!(un&&V.dirty));
  $('#vTitle').textContent = V.dono ? `Cofre de ${V.dono}` : 'Cofre de acessos';
  $('#vSub').textContent = un ? `${V.data.entradas.length} acessos · só você vê · tranca sozinho após 10 min parado` : 'Pessoal: cada usuário do portal tem o seu, com a própria senha mestra';
  if(V.err){ body.innerHTML=`<div class="vlock"><img src="/monograma.svg" alt=""><h4>Cofre indisponível</h4><p>${esc(V.err)}</p></div>`; return; }
  if(!hasCrypto){ body.innerHTML=`<div class="vlock"><img src="/monograma.svg" alt=""><h4>Cofre indisponível aqui</h4><p>O cofre cifra as senhas no navegador e isso só funciona em HTTPS. Abra pelo endereço https://documentacao.noc.updown.com.br.</p></div>`; return; }
  if(!un){
    const novo=!V.blob;
    body.innerHTML=`<form class="vlock" id="vForm" autocomplete="off"><img src="/monograma.svg" alt=""><h4>${novo?'Criar o seu cofre':'Seu cofre está trancado'}</h4>
      <p>${novo?`Este cofre é só de <b>${esc(V.dono||'você')}</b>: outros usuários do portal e o administrador não têm acesso. Escolha a senha mestra; os acessos são cifrados no seu navegador com ela (AES-256) e o servidor guarda só o conteúdo cifrado. <b>Se a senha mestra for esquecida, ninguém consegue abrir o cofre.</b>`:`Digite a sua senha mestra para abrir o cofre de <b>${esc(V.dono||'você')}</b>. Ela não é a senha do portal.`}</p>
      <input type="password" id="vPw" placeholder="Senha mestra" autocomplete="${novo?'new-password':'current-password'}">
      ${novo?'<input type="password" id="vPw2" placeholder="Repita a senha mestra" autocomplete="new-password">':''}
      <div class="err" id="vErr"></div><button class="btn primary" type="submit" id="vGo">${novo?'Criar cofre':'Abrir cofre'}</button></form>`;
    $('#vPw').focus();
    $('#vForm').onsubmit=async ev=>{ ev.preventDefault(); const pw=$('#vPw').value; const err=$('#vErr'); err.textContent='';
      if(novo){ if(pw.length<10) return err.textContent='Use pelo menos 10 caracteres.'; if(pw!==$('#vPw2').value) return err.textContent='As senhas não conferem.';
      }
      $('#vGo').disabled=true; $('#vGo').textContent=novo?'Criando…':'Abrindo…';
      try{
        if(novo){ V.salt=crypto.getRandomValues(new Uint8Array(16)); V.iter=600000; V.key=await vDerive(pw,V.salt,V.iter); V.data={entradas:[]}; V.dirty=true; await vSaveNow(); }
        else { V.salt=b64d(V.blob.salt); V.iter=V.blob.iter; const k=await vDerive(pw,V.salt,V.iter);
          const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(V.blob.iv)},k,b64d(V.blob.ct)); V.key=k; V.data=JSON.parse(new TextDecoder().decode(pt)); if(!Array.isArray(V.data.entradas)) V.data.entradas=[]; }
        vTouch(); R3.safeState(true); vRender(); renderDetail();
      }catch(e){ V.key=null; err.textContent=novo?('Não foi possível criar: '+e.message):'Senha mestra incorreta.'; $('#vGo').disabled=false; $('#vGo').textContent=novo?'Criar cofre':'Abrir cofre'; }
    };
    return;
  }
  const q=V.q.toLowerCase(); const list=V.data.entradas.filter(e=>(!V.cat||e.categoria===V.cat)&&(!q||[e.plataforma,e.url,e.usuario,e.notas,(e.extras||[]).map(x=>x.rotulo+' '+(x.secreto?'':x.valor)).join(' '),(e.devices||[]).map(devName).join(' ')].join(' ').toLowerCase().includes(q)));
  const cats=[...VCATS, ...new Set(V.data.entradas.map(e=>e.categoria).filter(c=>!VCATS.includes(c)))];
  const ed=V.canEdit;
  body.innerHTML=`${V.legado?`<div class="ro" style="margin-bottom:14px;border-style:solid;border-color:var(--part)">Existe no servidor o <b>cofre compartilhado da versão anterior</b>. Se você sabe a senha mestra dele, traga os acessos para o seu cofre pessoal. <button class="lk" id="vLeg">trazer acessos</button></div>`:''}<div class="vtool"><input type="search" id="vQ" placeholder="Buscar plataforma, link, usuário, aparelho…" value="${esc(V.q)}">
    <select id="vCat"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${c===V.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <div class="spacer"></div>${ed?`<button class="btn" id="vNew">Novo acesso</button><button class="btn" id="vImp">Importar arquivo</button><button class="btn ghost" id="vPwc">Trocar senha mestra</button>`:''}</div>
    ${V.edit==='__new'?`<div class="vgrid"><div class="ventry hl">${vFormHtml({id:'__new',categoria:V.cat||VCATS[0],plataforma:'',url:'',usuario:'',senha:'',notas:'',devices:[],extras:[]})}</div></div>`:''}
    ${list.length?cats.filter(c=>list.some(e=>e.categoria===c)).map(c=>`<div class="vcat">${esc(c)} · ${list.filter(e=>e.categoria===c).length}</div><div class="vgrid">${list.filter(e=>e.categoria===c).sort((a,b)=>a.plataforma.localeCompare(b.plataforma,'pt-BR',{numeric:true})).map(vEntryHtml).join('')}</div>`).join('')
      :`<div class="vempty">${V.data.entradas.length?'Nada encontrado com esse filtro.':'Cofre vazio. Use "Importar arquivo" para trazer os acessos do arquivo cofre-importar.json ou "Novo acesso".'}</div>`}`;
  $('#vQ').oninput=e=>{ V.q=e.target.value; const p=e.target.selectionStart; vRender(); const n=$('#vQ'); n.focus(); n.setSelectionRange(p,p); };
  $('#vCat').onchange=e=>{ V.cat=e.target.value; vRender(); };
  if($('#vLeg')) $('#vLeg').onclick=vLegado;
  if(ed){ $('#vNew').onclick=()=>{ V.edit='__new'; vRender(); }; $('#vImp').onclick=()=>$('#vFile').click(); $('#vPwc').onclick=vChangePw; }
  body.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>vAct(b.dataset.act,b.dataset.id,b));
  body.querySelectorAll('.vdevs span[data-dev]').forEach(s=>s.onclick=()=>{ const k=S.devices.findIndex(d=>d.id===s.dataset.dev); if(k>=0){ closeVault(); select(k); } });
  body.querySelectorAll('form.vform').forEach(f=>f.onsubmit=ev=>{ ev.preventDefault(); vSubmit(f); });
  body.querySelectorAll('[data-addx]').forEach(b=>b.onclick=()=>{ const box=b.parentElement.querySelector('.xs'); box.insertAdjacentHTML('beforeend',vExtraRow({rotulo:'',valor:'',secreto:false})); box.lastElementChild.querySelector('[data-delx]').onclick=ev=>ev.target.closest('.extra').remove(); });
  body.querySelectorAll('[data-delx]').forEach(b=>b.onclick=()=>b.closest('.extra').remove());
}
function linkHtml(u){ if(!u) return '—'; if(/^https?:\/\//i.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\//,''))}</a>`; return esc(u); }
function vEntryHtml(e){
  if(V.edit===e.id) return `<div class="ventry hl" data-id="${e.id}">${vFormHtml(e)}</div>`;
  const sh=V.show.has(e.id); const ed=V.canEdit;
  const row=(k,v,copy,secret)=> v?`<div class="vrow"><span class="k">${k}</span><span class="v">${secret&&!sh?'••••••••':(k==='Link'?linkHtml(v):esc(v))}</span><span class="acts">${secret?`<button class="lk" data-act="show" data-id="${e.id}">${sh?'ocultar':'mostrar'}</button>`:''}${copy?`<button class="lk" data-act="copy" data-id="${e.id}" data-v="${esc(k)}">copiar</button>`:''}</span></div>`:'';
  return `<div class="ventry ${V.hl===e.id?'hl':''}" data-id="${e.id}"><h5><span>${esc(e.plataforma)}</span>${ed?`<span class="acts"><button class="lk" data-act="edit" data-id="${e.id}">editar</button><button class="lk" data-act="del" data-id="${e.id}">excluir</button></span>`:''}</h5>
    ${row('Link',e.url,true,false)}${row('Usuário',e.usuario,true,false)}${row('Senha',e.senha,true,true)}
    ${(e.extras||[]).map((x,i)=>x.valor?`<div class="vrow"><span class="k">${esc(x.rotulo)}</span><span class="v">${x.secreto&&!sh?'••••••••':esc(x.valor)}</span><span class="acts"><button class="lk" data-act="copyx" data-id="${e.id}" data-i="${i}">copiar</button></span></div>`:'').join('')}
    ${e.notas?`<div class="vnote">${esc(e.notas)}</div>`:''}
    ${(e.devices||[]).length?`<div class="vdevs">${e.devices.map(id=>`<span data-dev="${esc(id)}" title="Abrir o equipamento">${esc(devName(id))}</span>`).join('')}</div>`:''}</div>`;
}
function vExtraRow(x){ return `<div class="extra"><input placeholder="Rótulo (ex.: Token)" value="${esc(x.rotulo)}" data-xr><input placeholder="Valor" value="${esc(x.valor)}" data-xv><label style="font-size:11px;color:var(--ink3);display:flex;gap:3px;align-items:center"><input type="checkbox" data-xs ${x.secreto?'checked':''}>secreto</label><button type="button" class="lk" data-delx>remover</button></div>`; }
function vFormHtml(e){
  return `<form class="vform" data-id="${e.id}" autocomplete="off">
    <div class="field"><label>Plataforma</label><input name="plataforma" value="${esc(e.plataforma)}" required></div>
    <div class="field"><label>Categoria</label><input name="categoria" list="vcats" value="${esc(e.categoria)}"><datalist id="vcats">${VCATS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
    <div class="field full"><label>Link de acesso (https://… ou ssh://IP)</label><input name="url" class="mono" value="${esc(e.url)}"></div>
    <div class="field"><label>Usuário</label><input name="usuario" class="mono" value="${esc(e.usuario)}"></div>
    <div class="field"><label>Senha</label><input name="senha" type="text" class="mono" value="${esc(e.senha)}"></div>
    <div class="field full"><label>Outros campos (token, código, telefone…)</label><div class="xs">${(e.extras||[]).map(vExtraRow).join('')}</div><button type="button" class="lk" data-addx>adicionar campo</button></div>
    <div class="field full"><label>Notas</label><textarea name="notas" rows="3">${esc(e.notas)}</textarea></div>
    <div class="field full"><label>Aparelhos ligados a este acesso</label><div class="devpick">${S.devices.map(d=>`<label><input type="checkbox" name="dev" value="${esc(d.id)}" ${(e.devices||[]).includes(d.id)?'checked':''}>${esc(d.name)}</label>`).join('')}</div></div>
    <div class="field full" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" data-act="cancel" data-id="${e.id}">Cancelar</button><button class="btn primary" type="submit">Aplicar</button></div></form>`;
}
function vSubmit(f){
  const id=f.dataset.id; const g=n=>f.querySelector(`[name="${n}"]`).value.trim();
  const e={id:id==='__new'?Math.random().toString(16).slice(2,12):id, plataforma:g('plataforma')||'(sem nome)', categoria:g('categoria')||'Outros', url:g('url'), usuario:g('usuario'), senha:f.querySelector('[name="senha"]').value, notas:f.querySelector('[name="notas"]').value.trim(),
    devices:[...f.querySelectorAll('[name="dev"]:checked')].map(c=>c.value),
    extras:[...f.querySelectorAll('.extra')].map(r=>({rotulo:r.querySelector('[data-xr]').value.trim(),valor:r.querySelector('[data-xv]').value,secreto:r.querySelector('[data-xs]').checked})).filter(x=>x.rotulo||x.valor)};
  if(id==='__new') V.data.entradas.push(e); else { const i=V.data.entradas.findIndex(x=>x.id===id); V.data.entradas[i]=e; }
  V.edit=null; V.hl=e.id; vDirty(); renderDetail();
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copiado'); } catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copiado'); }catch(_){ toast('Não foi possível copiar'); } ta.remove(); } }
function vAct(act,id,btn){
  const e=V.data.entradas.find(x=>x.id===id);
  if(act==='show'){ V.show.has(id)?V.show.delete(id):V.show.add(id); vRender(); }
  else if(act==='copy'){ const k=btn.dataset.v; copyText(k==='Link'?e.url:k==='Usuário'?e.usuario:e.senha); }
  else if(act==='copyx'){ copyText(e.extras[+btn.dataset.i].valor); }
  else if(act==='edit'){ V.edit=id; vRender(); }
  else if(act==='cancel'){ V.edit=null; vRender(); }
  else if(act==='del'){ confirmBox('Excluir acesso?', `${e.plataforma} sai do seu cofre.`, 'Excluir', ()=>{ V.data.entradas=V.data.entradas.filter(x=>x.id!==id); vDirty(); renderDetail(); }); }
}
$('#vFile').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f||!V.key) return;
  let j; try{ j=JSON.parse(await f.text()); }catch(e){ return toast('Arquivo não é um JSON válido'); }
  const arr=Array.isArray(j)?j:(j.entradas||[]); if(!arr.length) return toast('Nenhum acesso no arquivo');
  const n=vMerge(arr);
  vDirty(); renderDetail(); toast(`${n} acessos importados${arr.length-n?' ('+(arr.length-n)+' já existiam)':''}. Clique em Salvar cofre.`);
};
function vMerge(arr){
  const seen=new Set(V.data.entradas.map(e=>(e.plataforma+'|'+e.usuario).toLowerCase())); let n=0;
  arr.forEach(e=>{ const key=(String(e.plataforma||'')+'|'+String(e.usuario||'')).toLowerCase(); if(seen.has(key)) return; seen.add(key);
    V.data.entradas.push({id:Math.random().toString(16).slice(2,12), categoria:e.categoria||'Outros', plataforma:String(e.plataforma||'(sem nome)'), url:e.url||'', usuario:e.usuario||'', senha:e.senha||'', notas:e.notas||'', devices:(e.devices||[]).filter(id=>S.devices.some(d=>d.id===id)), extras:(e.extras||[]).map(x=>({rotulo:x.rotulo||'',valor:x.valor||'',secreto:!!x.secreto}))}); n++; });
  return n;
}
function vLegado(){
  modal(`<h3>Trazer o cofre compartilhado antigo</h3><p>Digite a senha mestra que foi usada no cofre compartilhado (versão anterior). Os acessos entram no <b>seu</b> cofre, cifrados com a <b>sua</b> senha mestra.</p>
    <div class="field"><label>Senha mestra antiga</label><input type="password" id="lgP" autocomplete="off"></div><div style="color:var(--down);font-size:13px" id="lgE"></div>
    <div class="acts"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="lgOk">Trazer</button></div>`);
  $('#lgP').focus();
  $('#lgOk').onclick=async()=>{ $('#lgE').textContent=''; $('#lgOk').disabled=true;
    try{ const r=await api('GET','/api/cofre/legado'); const b=r.blob; const k=await vDerive($('#lgP').value,b64d(b.salt),b.iter);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(b.iv)},k,b64d(b.ct)); const old=JSON.parse(new TextDecoder().decode(pt));
      const n=vMerge(old.entradas||[]); closeModal(); vDirty(); renderDetail();
      if(await vSaveNow()){
        confirmBox('Retirar o cofre antigo do servidor?', `${n} acessos foram para o seu cofre. Retire o cofre compartilhado para que ninguém mais o use (fica só uma cópia cifrada de segurança no servidor).`, 'Retirar', async()=>{ try{ await api('DELETE','/api/cofre/legado'); V.legado=false; vRender(); toast('Cofre compartilhado antigo retirado'); }catch(e){ toast('Não foi possível retirar: '+e.message); } });
      }
    }catch(e){ $('#lgOk').disabled=false; $('#lgE').textContent = e.status===404 ? 'O cofre antigo já foi retirado.' : 'Senha mestra antiga incorreta.'; }
  };
}
function vChangePw(){
  modal(`<h3>Trocar senha mestra</h3><p>O seu cofre é cifrado de novo com a senha nova.</p>
    <div class="field"><label>Senha nova</label><input type="password" id="np1" autocomplete="new-password"></div>
    <div class="field"><label>Repita</label><input type="password" id="np2" autocomplete="new-password"></div><div style="color:var(--down);font-size:13px" id="npE"></div>
    <div class="acts"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="npOk">Trocar</button></div>`);
  $('#npOk').onclick=async()=>{ const a=$('#np1').value; if(a.length<10) return $('#npE').textContent='Use pelo menos 10 caracteres.'; if(a!==$('#np2').value) return $('#npE').textContent='As senhas não conferem.';
    V.salt=crypto.getRandomValues(new Uint8Array(16)); V.key=await vDerive(a,V.salt,V.iter); V.dirty=true; closeModal(); if(await vSaveNow()) toast('Senha mestra trocada'); };
}
// acessos do aparelho na ficha
function devAccessHtml(d){
  if(!hasCrypto) return '';
  if(V.err) return '';
  if(!V.key) return `<div><div class="sub">Acesso ao aparelho</div><div class="ro">Seu cofre está trancado. <button class="lk" id="dOpen">abrir meu cofre</button></div></div>`;
  const acc=V.data.entradas.filter(e=>(e.devices||[]).includes(d.id));
  if(!acc.length) return `<div><div class="sub">Acesso ao aparelho</div><div class="ro">Nenhum acesso do seu cofre ligado a este aparelho. <button class="lk" id="dOpen">abrir meu cofre</button></div></div>`;
  return `<div><div class="sub">Acesso ao aparelho (seu cofre)</div><div class="dev-acc">${acc.map(e=>`<div class="ventry" data-id="${e.id}"><h5><span>${esc(e.plataforma)}</span><span class="acts"><button class="lk" data-dact="open" data-id="${e.id}">no cofre</button></span></h5>
    ${e.url?`<div class="vrow"><span class="k">Link</span><span class="v">${linkHtml(e.url)}</span><span class="acts"><button class="lk" data-dact="cu" data-id="${e.id}">copiar</button></span></div>`:''}
    ${e.usuario?`<div class="vrow"><span class="k">Usuário</span><span class="v">${esc(e.usuario)}</span><span class="acts"><button class="lk" data-dact="cus" data-id="${e.id}">copiar</button></span></div>`:''}
    ${e.senha?`<div class="vrow"><span class="k">Senha</span><span class="v">${V.show.has(e.id)?esc(e.senha):'••••••••'}</span><span class="acts"><button class="lk" data-dact="sh" data-id="${e.id}">${V.show.has(e.id)?'ocultar':'mostrar'}</button><button class="lk" data-dact="cp" data-id="${e.id}">copiar</button></span></div>`:''}</div>`).join('')}</div></div>`;
}
function bindDevAccess(){
  const o=$('#dOpen'); if(o) o.onclick=()=>openVault();
  document.querySelectorAll('#detail [data-dact]').forEach(b=>b.onclick=()=>{ const e=V.data.entradas.find(x=>x.id===b.dataset.id); const a=b.dataset.dact;
    if(a==='open') openVault(e.id); else if(a==='cu') copyText(e.url); else if(a==='cus') copyText(e.usuario); else if(a==='cp') copyText(e.senha); else if(a==='sh'){ V.show.has(e.id)?V.show.delete(e.id):V.show.add(e.id); renderDetail(); } });
}
$('#bCofre').onclick=()=>openVault();

/* ---------- boot ---------- */
let booted = false;
(async function boot(){
  try {
    const r = await api('GET', '/api/dados');
    S = r.doc; REV = r.rev; CAN_EDIT = !!r.can_edit; USER = r.user;
    if (!Array.isArray(S.devices)) S.devices = [];
    document.body.classList.toggle('ro-mode', !CAN_EDIT);
    $('#user').innerHTML = r.login ? `<span>${esc(USER||'')}${r.admin?' <span class="badge" title="Administrador no Portal NOC">admin</span>':(!CAN_EDIT?' <span class="badge">consulta</span>':'')}</span><a href="/logout">Sair</a>` : '';
    try { ZC = await api('GET', '/api/zabbix'); } catch(e) {}
    applyZ();
    if (!S.devices.length) S.devices.push({id:'d'+Date.now(),name:'NOVO EQUIPAMENTO',model:'',site:'',rack:'',role:'',mgmt:'',notes:'',zabbix_hosts:[],ports:[]});
    const want = decodeURIComponent((location.hash||'').slice(1)).toLowerCase();
    let k0 = S.devices.findIndex(d => d.name.toLowerCase().replace(/\s+/g,'-') === want); if (k0 < 0) k0 = 0;
    await vLoad(); R3.init();
    renderKPIs(); renderSites(); updSave(); select(k0,{fromUser:false}); booted = true;
    $('#boot').remove();
  } catch (e) {
    console.error(e);
    if (e.message !== 'login') $('#bootTxt').textContent = 'Não foi possível carregar a documentação: ' + e.message;
  }
})();

})();
</script>
